<style>
:root{
  --lacquer:#0A0709;
  --panel:#120C10;
  --panel-2:#180F14;
  --crimson:#D01B2E;
  --ember:#F2564B;
  --bone:#EDE6E2;
  --ash:#93838A;
  --hair:rgba(237,230,226,.11);
  --hair-red:rgba(208,27,46,.34);
  --ok:#3FB27F;
  --serif:"Frank Ruhl Libre","Cormorant Garamond",Georgia,serif;
  --sans:"Assistant","Helvetica Neue",Arial,sans-serif;
  --step:clamp(15px,1.1vw + 12px,17px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:
    radial-gradient(120% 70% at 50% -12%, rgba(208,27,46,.20), transparent 62%),
    radial-gradient(90% 50% at 50% 118%, rgba(242,86,75,.09), transparent 60%),
    var(--lacquer);
  background-attachment:fixed;
  color:var(--bone);
  font-family:var(--sans);
  font-size:var(--step);
  line-height:1.55;
  min-height:100dvh;
}
.wrap{max-width:600px;margin:0 auto;padding-inline:20px;padding-block:26px 64px}
[dir="rtl"] .wrap{text-align:right}

/* ---- masthead ---- */
.mast{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
.mark{display:flex;align-items:baseline;gap:10px;min-width:0}
.mark b{font-family:var(--serif);font-weight:900;font-size:30px;letter-spacing:.02em;line-height:1;color:var(--bone)}
.mark span{font-family:var(--sans);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--crimson);font-weight:600;white-space:nowrap}
.lang{display:flex;border:1px solid var(--hair);border-radius:2px;overflow:hidden;flex:none}
.lang button{appearance:none;background:transparent;border:0;color:var(--ash);font:600 11px/1 var(--sans);letter-spacing:.16em;padding:8px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--crimson);color:#fff}

/* ---- type ---- */
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:800;text-wrap:balance;line-height:1.18}
h1{font-size:clamp(30px,7vw,42px);letter-spacing:-.01em}
h2{font-size:clamp(22px,5vw,27px)}
.eyebrow{font:600 10px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--crimson)}
.lede{color:var(--ash);margin:10px 0 0;max-width:52ch}
.muted{color:var(--ash)}
.tnum{font-variant-numeric:tabular-nums}

/* ---- layout blocks ---- */
.stage{display:flex;flex-direction:column;gap:22px;padding-top:26px}
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--hair);border-radius:3px;padding:20px}
.panel.lift{border-color:var(--hair-red);box-shadow:0 0 0 1px rgba(208,27,46,.10),0 22px 60px -32px rgba(208,27,46,.75)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.rule{height:1px;background:var(--hair);border:0;margin:0}

/* ---- controls ---- */
.btn{appearance:none;display:block;width:100%;cursor:pointer;font:600 15px/1 var(--sans);letter-spacing:.02em;
  padding:15px 18px;border-radius:2px;border:1px solid transparent;background:var(--crimson);color:#fff;transition:filter .16s,transform .16s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.ghost{background:transparent;border-color:var(--hair);color:var(--bone)}
.btn.ghost:hover:not(:disabled){border-color:var(--hair-red);background:rgba(208,27,46,.07)}
.btn.small{padding:11px 14px;font-size:13px}
input[type=text]{width:100%;background:#0B0709;border:1px solid var(--hair);border-radius:2px;color:var(--bone);
  font:400 17px/1.3 var(--sans);padding:15px 16px;outline:0}
input[type=text]::placeholder{color:#5C5056}
input[type=text]:focus{border-color:var(--hair-red)}
input.code{font-family:var(--serif);font-weight:800;font-size:30px;letter-spacing:.42em;text-align:center;text-transform:uppercase;direction:ltr;padding-left:.42em}
label.field{display:block}
label.field>span{display:block;font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--ash);margin-bottom:9px}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* ---- room code ---- */
.codebar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.codebig{font-family:var(--serif);font-weight:900;font-size:clamp(40px,12vw,58px);letter-spacing:.20em;line-height:1;color:var(--bone);
  padding-inline-start:.20em;text-shadow:0 0 34px rgba(208,27,46,.5)}

/* ---- roster ---- */
.roster{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.roster li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--hair)}
.roster li:first-child{border-top:0}
.seat{flex:none;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--hair-red);border-radius:50%;
  font:600 12px/1 var(--sans);color:var(--crimson)}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.tag{flex:none;font:600 9px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ash);
  border:1px solid var(--hair);border-radius:2px;padding:5px 7px}
.tag.on{color:var(--ok);border-color:rgba(63,178,127,.4)}
.tag.host{color:var(--crimson);border-color:var(--hair-red)}
.pts{flex:none;font-family:var(--serif);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;color:var(--bone);min-width:2ch;text-align:center}
.roster li.lead .pts{color:var(--ember)}
.roster li.me .nm{color:var(--ember)}

/* ---- hold-to-reveal card ---- */
.holder{perspective:1400px}
.card{position:relative;aspect-ratio:5/6.2;max-width:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.75,.2,1)}
.card.open{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:26px}
.back{background:
    repeating-linear-gradient(45deg,rgba(208,27,46,.10) 0 2px,transparent 2px 9px),
    linear-gradient(170deg,#1A1014,#0B0709);
  border:1px solid var(--hair-red);box-shadow:inset 0 0 70px rgba(208,27,46,.16)}
.back .seal{width:74px;height:74px;border:1px solid var(--hair-red);border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-weight:900;font-size:30px;color:var(--crimson)}
.front{transform:rotateY(180deg);background:linear-gradient(170deg,#1D0D11,#0C0708);border:1px solid var(--crimson);
  box-shadow:inset 0 0 80px rgba(208,27,46,.30)}
.front .word{font-family:var(--serif);font-weight:900;font-size:clamp(30px,9vw,46px);line-height:1.1;color:var(--bone)}
.front.imp .word{color:var(--ember)}
.hint{font:600 10px/1.4 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--ash)}

/* ---- clues ---- */
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--hair)}
.clues li{background:var(--panel);padding:14px 16px;display:flex;align-items:baseline;gap:14px}
.clues .who{font:600 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ash);flex:none;max-width:40%;overflow-wrap:anywhere}
.clues .wd{font-family:var(--serif);font-weight:800;font-size:23px;color:var(--bone);overflow-wrap:anywhere}

/* ---- vote grid ---- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vote{appearance:none;cursor:pointer;text-align:inherit;background:var(--panel);border:1px solid var(--hair);border-radius:2px;
  padding:15px;color:var(--bone);font:600 15px/1.25 var(--sans);display:flex;flex-direction:column;gap:6px;transition:border-color .15s,background .15s}
.vote:hover:not(:disabled){border-color:var(--hair-red)}
.vote[aria-pressed="true"]{border-color:var(--crimson);background:rgba(208,27,46,.14)}
.vote:disabled{opacity:.4;cursor:not-allowed}
.vote small{font:400 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}

/* ---- verdict ---- */
.verdict{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.verdict .who{font-family:var(--serif);font-weight:900;font-size:clamp(28px,8vw,40px);color:var(--ember);line-height:1.1;overflow-wrap:anywhere}
.badge{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;padding:8px 12px;border-radius:2px}
.badge.win{background:rgba(63,178,127,.14);color:var(--ok);border:1px solid rgba(63,178,127,.34)}
.badge.lose{background:rgba(208,27,46,.16);color:var(--ember);border:1px solid var(--hair-red)}
.tally{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.chip{font:600 12px/1 var(--sans);border:1px solid var(--hair);border-radius:2px;padding:8px 10px;color:var(--ash)}
.chip b{color:var(--bone);font-weight:600}

.status{font:600 11px/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ash);text-align:center}
.err{color:var(--ember);font-size:14px}
details.rules{border-top:1px solid var(--hair);padding-top:14px}
details.rules summary{cursor:pointer;font:600 10px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--ash);list-style:none}
details.rules summary::-webkit-details-marker{display:none}
details.rules ol{margin:14px 0 0;padding-inline-start:1.3em;color:var(--ash);display:flex;flex-direction:column;gap:9px;font-size:14px}
details.rules ol b{color:var(--bone);font-weight:600}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font:400 11px/1.4 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#584B51}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
.fade{animation:fade .34s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

  if(!(window.claude&&window.claude.use))return Promise.resolve(null);
  return window.claude.use("db").then(function(d){db=d;return d;},function(){return null;});
}
function roomDoc(code){return db.doc("rooms/"+code);}
function playersCol(code){return db.collection("rooms/"+code+"/players");}
function me(){for(var i=0;i<players.length;i++)if(players[i].id===ME)return players[i];return null;}
function byId(id){for(var i=0;i<players.length;i++)if(players[i].id===id)return players[i];return null;}
function nameOf(id){var p=byId(id);return p?p.name:"—";}
function isHost(){return !!room&&room.hostId===ME;}
function active(){return players.filter(function(p){return p.inRound;});}

function clearSubs(){unsubs.forEach(function(u){try{u();}catch(e){}});unsubs=[];}

function watch(code){
  clearSubs();
  unsubs.push(roomDoc(code).onSnapshot(function(s){
    room=s.exists?s.data():null;
    if(room&&!room.code)room.code=code;
    render();hostTick();
  }));
  unsubs.push(playersCol(code).onSnapshot(function(q){
    players=q.docs.map(function(d){var o=d.data()||{};o.id=o.id||d.id;return o;})
      .sort(function(a,b){return (a.joinedAt||0)-(b.joinedAt||0);});
    render();hostTick();
  }));
  if(heartbeat)clearInterval(heartbeat);
  heartbeat=setInterval(function(){
    if(!db||!CODE)return;
    playersCol(CODE).doc(ME).update({lastSeen:now()}).catch(function(){});
  },9000);
}

function newCode(){
  var L="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";
  for(var i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];
  return s;
}

function createRoom(){
  if(!MYNAME.trim()){err=t("needName");render();return;}
  busy=true;render();
  var code=newCode();
  roomDoc(code).set({
    code:code,hostId:ME,phase:"lobby",round:0,createdAt:now(),
    catIdx:0,wordIdx:0,impostorId:"",options:[],order:[],
    guess:-1,caught:false,accusedId:"",scoredRound:-1,forced:false
  }).then(function(){
    return playersCol(code).doc(ME).set(seat(MYNAME));
  }).then(function(){
    CODE=code;view="room";err="";busy=false;
    try{location.hash=code;}catch(e){}
    watch(code);render();
  }).catch(function(){busy=false;err=t("badCode");render();});
}

function seat(name){
  return {id:ME,name:name.trim().slice(0,18),score:0,joinedAt:now(),lastSeen:now(),
    ready:false,clue:"",vote:"",inRound:false};
}

function joinRoom(code){
  code=(code||"").trim().toUpperCase();
  if(!MYNAME.trim()){err=t("needName");render();return;}
  if(code.length!==4){err=t("badCode");render();return;}
  busy=true;render();
  roomDoc(code).get().then(function(s){
    if(!s.exists)throw new Error("nope");
    return playersCol(code).doc(ME).get().then(function(mine){
      var prev=mine.exists?mine.data():null;
      var data=seat(MYNAME);
      if(prev){data.score=prev.score||0;data.joinedAt=prev.joinedAt||now();data.inRound=!!prev.inRound;
        data.ready=!!prev.ready;data.clue=prev.clue||"";data.vote=prev.vote||"";}
      return playersCol(code).doc(ME).set(data);
    });
  }).then(function(){
    CODE=code;view="room";err="";busy=false;
    try{location.hash=code;}catch(e){}
    watch(code);render();
  }).catch(function(){busy=false;err=t("badCode");render();});
}

function leaveRoom(){
  if(db&&CODE){playersCol(CODE).doc(ME).delete().catch(function(){});}
  clearSubs();if(heartbeat)clearInterval(heartbeat);
  CODE=null;room=null;players=[];view="home";
  try{location.hash="";}catch(e){}
  render();
}

/* ============ host logic ============ */
function startRound(){
  if(!isHost())return;
  var seated=players.slice();
  if(seated.length<3)return;
  var catIdx=Math.floor(Math.random()*DECK.length);
  var cat=DECK[catIdx];
  var wordIdx=Math.floor(Math.random()*cat.w.length);
  var imp=seated[Math.floor(Math.random()*seated.length)].id;
  var pool=[];for(var i=0;i<cat.w.length;i++)if(i!==wordIdx)pool.push(i);
  shuffle(pool);
  var options=shuffle(pool.slice(0,5).concat([wordIdx]));
  var order=shuffle(seated.map(function(p){return p.id;}));
  var r=(room.round||0)+1;
  var writes=seated.map(function(p){
    return playersCol(CODE).doc(p.id).update({ready:false,clue:"",vote:"",inRound:true});
  });
  Promise.all(writes).then(function(){
    return roomDoc(CODE).update({
      phase:"reveal",round:r,catIdx:catIdx,wordIdx:wordIdx,impostorId:imp,
      options:options,order:order,guess:-1,caught:false,accusedId:"",forced:false
    });
  }).catch(function(){});
}

function tally(){
  var counts={},list=active();
  list.forEach(function(p){if(p.vote)counts[p.vote]=(counts[p.vote]||0)+1;});
  var best=-1,winners=[];
  Object.keys(counts).forEach(function(k){
    if(counts[k]>best){best=counts[k];winners=[k];}
    else if(counts[k]===best)winners.push(k);
  });
  return {counts:counts,accused:winners.length===1?winners[0]:"",top:best};
}

function applyScores(caught,guessRight){
  var list=active(),jobs=[];
  if(!caught){
    var imp=byId(room.impostorId);
    if(imp)jobs.push(playersCol(CODE).doc(imp.id).update({score:(imp.score||0)+3}));
  }else{
    list.forEach(function(p){
      if(p.id!==room.impostorId&&p.vote===room.impostorId)
        jobs.push(playersCol(CODE).doc(p.id).update({score:(p.score||0)+2}));
    });
    if(guessRight){
      var im=byId(room.impostorId);
      if(im)jobs.push(playersCol(CODE).doc(im.id).update({score:(im.score||0)+2}));
    }
  }
  return Promise.all(jobs);
}

var ticking=false;
function hostTick(){
  if(!room||!isHost()||!db||ticking)return;
  var list=active();
  if(!list.length)return;
  var f=room.forced;
  if(room.phase==="reveal"){
    if(list.every(function(p){return p.ready;})){
      ticking=true;roomDoc(CODE).update({phase:"clues",forced:false}).then(done,done);
    }
  }else if(room.phase==="clues"){
    if(list.every(function(p){return (p.clue||"").trim();})){
      ticking=true;roomDoc(CODE).update({phase:"vote",forced:false}).then(done,done);
    }
  }else if(room.phase==="vote"){
    if(list.every(function(p){return p.vote;})){
      var r=tally();
      var caught=r.accused===room.impostorId&&!!r.accused;
      ticking=true;
      if(caught){
        roomDoc(CODE).update({phase:"guess",caught:true,accusedId:r.accused,forced:false}).then(done,done);
      }else{
        if(room.scoredRound===room.round){ticking=false;return;}
        applyScores(false,false).then(function(){
          return roomDoc(CODE).update({phase:"results",caught:false,accusedId:r.accused,scoredRound:room.round,forced:false});
        }).then(done,done);
      }
    }
  }else if(room.phase==="guess"){
    if(room.guess!==-1){
      if(room.scoredRound===room.round)return;
      ticking=true;
      applyScores(true,room.guess===room.wordIdx).then(function(){
        return roomDoc(CODE).update({phase:"results",scoredRound:room.round});
      }).then(done,done);
    }
  }
  function done(){ticking=false;}
}

function forceOn(){
  if(!isHost()||!room)return;
  var list=active(),jobs=[];
  if(room.phase==="reveal"){
    list.forEach(function(p){if(!p.ready)jobs.push(playersCol(CODE).doc(p.id).update({ready:true}));});
  }else if(room.phase==="clues"){
    list.forEach(function(p){if(!(p.clue||"").trim())jobs.push(playersCol(CODE).doc(p.id).update({clue:"—"}));});
  }else if(room.phase==="vote"){
    list.forEach(function(p){if(!p.vote)jobs.push(playersCol(CODE).doc(p.id).update({vote:"skip"}));});
  }else if(room.phase==="guess"){
    jobs.push(roomDoc(CODE).update({guess:-2}));
  }
  Promise.all(jobs).catch(function(){});
}

function claimHost(){if(room)roomDoc(CODE).update({hostId:ME}).catch(function(){});}
function hostAway(){
  if(!room)return false;
  var h=byId(room.hostId);
  if(!h)return true;
  return now()-(h.lastSeen||0)>32000;
}

function rosterList(showScore){
  var lead=0;players.forEach(function(p){lead=Math.max(lead,p.score||0);});

    var away=now()-(p.lastSeen||0)>32000;

    if(away)tags+='<span class="tag">'+esc(t("left"))+'</span>';
    if(room&&room.phase==="reveal"&&p.inRound&&p.ready)tags+='<span class="tag on">'+esc(t("ready"))+'</span>';
    if(room&&room.phase==="clues"&&p.inRound&&(p.clue||"").trim())tags+='<span class="tag on">'+esc(t("sent"))+'</span>';
    if(room&&room.phase==="vote"&&p.inRound&&p.vote)tags+='<span class="tag on">'+esc(t("voted"))+'</span>';

  on("codeIn","keydown",function(e){if(e.key==="Enter")joinRoom(joinCode);});
  on("btnCreate","click",function(){if(db)createRoom();else noDb();});
  on("btnJoin","click",function(){if(db)joinRoom(joinCode);else noDb();});
  on("btnLeave","click",leaveRoom);
  on("btnStart","click",startRound);
  on("btnReady","click",setReady);
  on("btnForce","click",forceOn);
  on("btnClaim","click",claimHost);
  on("btnCopy","click",function(){
    var url=location.href.split("#")[0]+"#"+room.code;
    var ok=function(){copied=true;render();setTimeout(function(){copied=false;render();},1800);};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(ok,ok);else ok();
  });
  on("clueIn","input",function(e){localClue=e.target.value;});
  on("clueIn","keydown",function(e){if(e.key==="Enter"){sendClue(localClue);localClue="";}});
  on("btnClue","click",function(){sendClue(localClue);localClue="";});

  var card=$("card");
  if(card){
    var open=function(e){e.preventDefault();held=true;card.classList.add("open");
      if(navigator.vibrate)try{navigator.vibrate(12);}catch(x){}};
    var close=function(){held=false;card.classList.remove("open");};
    card.addEventListener("pointerdown",open);
    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){card.addEventListener(ev,close);});
    card.addEventListener("contextmenu",function(e){e.preventDefault();});
  }
  Array.prototype.forEach.call(document.querySelectorAll("[data-vote]"),function(b){
    b.addEventListener("click",function(){castVote(b.getAttribute("data-vote"));});
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-guess]"),function(b){
    b.addEventListener("click",function(){sendGuess(parseInt(b.getAttribute("data-guess"),10));});
  });
}
function noDb(){err=t("noDb");render();}

$("langHe").addEventListener("click",function(){lang="he";lsSet("suspect.lang","he");render();});
$("langEn").addEventListener("click",function(){lang="en";lsSet("suspect.lang","en");render();});

/* ============ boot ============ */
applyLang();
joinCode=(location.hash||"").replace("#","").toUpperCase().slice(0,4);
render();
connect().then(function(d){
  if(!d){err=t("noDb");render();return;}
  if(joinCode.length===4&&MYNAME.trim()){/* leave it prefilled; user taps join */}
  render();
});
setInterval(function(){if(view==="room")render();},7000);
})();
</script>
